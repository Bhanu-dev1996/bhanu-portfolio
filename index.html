<!doctype html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bhanu Shankar — UX/UI Designer & Full Stack Developer</title>
    <meta
      name="description"
      content="Portfolio of Bhanu Shankar — UX/UI Designer & Full Stack Developer · React · Python · AI."
    />
    <meta name="author" content="Bhanu Shankar" />
    <meta
      name="keywords"
      content="UX/UI Designer, Full Stack Developer, React, Python, AI, Figma, FastAPI, RAG, LangChain, Portfolio"
    />
    <meta name="theme-color" content="#0b1526" />
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("bs-portfolio-theme");
          var dark = stored !== "light";
          document.documentElement.classList.toggle("dark", dark);
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", dark ? "#0b1526" : "#ffffff");
        } catch (e) {}
      })();
    </script>

    <!-- Open Graph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Bhanu Shankar — UX/UI Designer & Full Stack Developer" />
    <meta
      property="og:description"
      content="Designing thoughtful user experiences and building modern, scalable interfaces with React, JavaScript, and AI-assisted development."
    />
    <meta property="og:site_name" content="Bhanu Shankar Portfolio" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Bhanu Shankar — UX/UI Designer & Full Stack Developer" />
    <meta
      name="twitter:description"
      content="Designing thoughtful user experiences and building modern, scalable interfaces with React, JavaScript, and AI-assisted development."
    />

    <link
      rel="icon"
      type="image/svg+xml"
      href="/favicon.svg"
    />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;600;700;800;900&family=Open+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>

  </body>
</html>
